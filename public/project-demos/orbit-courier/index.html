<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101e30"><title>ORBIT COURIER</title><meta name="description" content="Switch between two orbital lanes. Deliver parcels, dodge debris, and bring your courier home through five short routes."><link rel="icon" href="cover.svg"><style>
:root{color-scheme:dark;--ink:#101e30;--cream:#fff0d8;--coral:#ff836b;--mint:#8de4cc}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font:15px/1.5 system-ui,sans-serif;min-height:100svh}button,a{font:inherit}button{cursor:pointer;border:1px solid #647082;background:transparent;color:var(--cream);border-radius:10px;padding:10px 15px;min-height:44px}button:hover{border-color:var(--mint)}button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.shell{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #ffffff25;padding-bottom:16px}.brand{font-size:14px;font-weight:850;letter-spacing:3px}.edition{font-size:10px;color:var(--coral);letter-spacing:2px}h1{font-size:clamp(30px,5vw,60px);line-height:1.05;margin:20px 0 12px;letter-spacing:-2px}h2{margin:0 0 12px;font-size:26px}p{margin:8px 0 16px;color:#c6ced8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:center}.stage{position:relative;min-width:0}canvas{width:100%;aspect-ratio:1;display:block;max-height:65svh;object-fit:contain;touch-action:manipulation}.hud{display:flex;justify-content:space-between;gap:10px;margin-top:20px;font-size:12px;color:#bcc7d5}.hud b{color:var(--cream);font-size:20px;display:block}.track{height:4px;background:#ffffff15;margin-top:10px;border-radius:8px;overflow:hidden}.track span{display:block;background:var(--mint);height:100%;width:0}.notice{min-height:44px;text-align:center;font-size:13px;color:var(--mint);padding:8px}.card{background:#182a40;border:1px solid #ffffff18;border-radius:18px;padding:24px}.label{font-size:10px;letter-spacing:3px;color:var(--mint);text-transform:uppercase}.primary{background:var(--coral);border:0;color:#101e30;font-weight:800}.switch{width:100%;font-size:18px;min-height:62px;box-shadow:0 6px 0 #b95344;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.lanes div{font-size:12px;padding:10px;border:1px solid #ffffff20;border-radius:8px}.lanes .active{border-color:var(--mint);color:var(--mint);background:#8de4cc10}.legend{display:flex;gap:14px;font-size:12px;color:#c6ced8;justify-content:center}.legend span:first-child{color:var(--mint)}.legend span:last-child{color:var(--coral)}.levels{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.levels button{width:42px;padding:8px;min-width:42px}.levels button.selected{background:#8de4cc;color:#101e30;border-color:var(--mint)}.small{font-size:12px}.keys{color:#a7b7cb;font-size:12px;margin-top:12px}dialog{border:1px solid #8de4cc50;border-radius:20px;color:var(--cream);background:#182a40;padding:30px;max-width:min(460px,calc(100% - 32px));box-shadow:0 30px 100px #0009}dialog::backdrop{background:#07101de8}dialog .primary{width:100%}.hidden{display:none!important}footer{border-top:1px solid #ffffff20;margin-top:22px;padding-top:16px;font-size:11px;color:#9aa9ba;display:flex;justify-content:space-between;gap:14px}footer a{color:var(--mint)}@media(max-width:750px){.shell{padding:16px}.layout{grid-template-columns:1fr;gap:8px}h1{font-size:35px;margin-top:16px}.card{padding:18px}canvas{max-height:43svh}.hud{margin-top:12px}.switch{margin-top:4px}.legend{font-size:11px}}@media(max-height:500px) and (min-width:751px){.shell{padding:12px 24px}.layout{grid-template-columns:1fr 300px}.card{padding:14px}canvas{max-height:65svh}h1{font-size:28px;margin:10px 0}.hud{margin-top:6px}}
</style></head><body><div class="shell"><header><div><div class="brand">ORBIT COURIER</div><div class="edition">TWO LANES · ONE WAY HOME</div></div><button id="language" aria-label="Switch language">中文</button></header><main class="layout"><section class="stage"><div class="hud"><div><span id="routeLabel"></span><b id="routeValue"></b></div><div><span id="parcelLabel"></span><b id="parcelValue"></b></div><div><span id="hullLabel"></span><b id="hullValue"></b></div><div><span id="timeLabel"></span><b id="timeValue"></b></div></div><div class="track"><span id="progress"></span></div><canvas id="game" width="640" height="640" aria-label="Two orbital lanes with a courier, incoming parcels and debris"></canvas><div class="legend"><span id="legendParcel"></span><span id="legendDebris"></span></div><div class="notice" id="notice" role="status" aria-live="polite"></div></section><aside><div class="label" id="eyebrow"></div><h1 id="stageName"></h1><p id="objective"></p><div class="card"><div class="label" id="nextLabel"></div><p id="incoming"></p><div class="lanes"><div id="inner"></div><div id="outer"></div></div><button class="primary switch" id="switch"></button><div class="row"><button id="start" class="primary"></button><button id="pause"></button><button id="retry"></button></div><div class="keys" id="keys"></div></div><div class="levels" id="levels" aria-label="Choose a route"></div><p class="small" id="saveNote"></p></aside></main><footer><span id="footer"></span><a href="/projects/game-demos" id="back"></a></footer></div><dialog id="result" aria-labelledby="resultTitle"><div class="label" id="resultKicker"></div><h2 id="resultTitle"></h2><p id="resultBody"></p><button id="resultAction" class="primary"></button><button id="resultRetry" style="width:100%;margin-top:10px"></button></dialog><script src="rules.js"></script><script>
(()=>{'use strict';const R=OrbitRules,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),KEY='orbit-courier-v1';let lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en',unlocked=0,index=0,state=null,mode='ready',practice=false,last=0,resultWon=false;
try{let n=Number(localStorage.getItem(KEY));if(Number.isInteger(n)&&n>=0&&n<5)unlocked=n}catch{}index=unlocked;
const words={en:{route:'ROUTE',parcel:'DELIVERED',hull:'HULL',time:'TIME LEFT',eyebrow:'ORBITAL DELIVERY SERVICE',goal:(n)=>`Collect at least ${n} mint parcels and stay alive until the route ends. Switch lanes to avoid coral debris.`,next:'NEXT ENCOUNTER',ready:'Your courier circles automatically. You control its lane.',inner:'INNER LANE',outer:'OUTER LANE',switch:'↔ SWITCH LANE',start:'Start route',pause:'Pause',resume:'Resume',retry:'Retry',keys:'Space / tap: switch · P / Esc: pause · R: retry. Tap the orbit to switch, too.',saved:'Routes unlock in order. Progress saves on this device.',footer:'A short, single-button arcade game. No account required.',back:'All games',legendParcel:'◆ PARCEL · collect',legendDebris:'✕ DEBRIS · avoid',practice:'Practice: switch lanes once before departure.',practiceDone:'Good. Press Start route when ready.',travel:'Route in progress — watch the next encounter.',paused:'Paused. Press Resume to continue.',delivered:'Parcel delivered',missed:'Parcel missed — look ahead to the next one.',hit:'Hull damaged! Switch away from debris.',safe:'Debris avoided',won:'Route complete',lost:'Route failed',all:'Welcome home, courier.',allBody:'All five routes are complete. Replay any route to improve your deliveries.',wonBody:(n,t)=>`You delivered ${n} parcels (target ${t}) and brought your courier home.`,lostBody:(n,t,h)=>h<=0?'The hull took three hits. Debris is marked with a coral cross; switch to the other lane before it reaches you.':`You delivered ${n}/${t} required parcels. Enter the same lane as mint diamonds to collect them.`,nextRoute:'Next route',replay:'Replay route',menu:'Replay final route',coming:(k,l,s)=>`${k==='parcel'?'◆ Parcel':'✕ Debris'} · ${l===0?'INNER':'OUTER'} · ${s.toFixed(1)}s`,training:'Training: no debris on this route.',disabledSave:'Progress cannot be saved in this browser; you can keep playing.'},zh:{route:'航线',parcel:'已送达',hull:'船体',time:'剩余时间',eyebrow:'轨道快递服务',goal:n=>`收集至少 ${n} 个薄荷色包裹，并存活至航线结束。切换轨道以避开珊瑚色碎片。`,next:'即将相遇',ready:'快递船会自动绕行，你只需控制所在轨道。',inner:'内轨',outer:'外轨',switch:'↔ 切换轨道',start:'开始航线',pause:'暂停',resume:'继续',retry:'重试',keys:'空格 / 点击：切换 · P / Esc：暂停 · R：重试。也可点击轨道切换。',saved:'按顺序解锁航线，进度保存在本设备。',footer:'单键操作的短局街机游戏，无需账号。',back:'全部游戏',legendParcel:'◆ 包裹 · 收集',legendDebris:'✕ 碎片 · 避开',practice:'先练习：切换一次轨道再出发。',practiceDone:'很好！准备好后点击开始航线。',travel:'航行中——留意下一次相遇。',paused:'已暂停，点击继续返回航线。',delivered:'包裹已送达',missed:'错过包裹了，留意下一个。',hit:'船体受损！切到另一条轨道避开碎片。',safe:'成功避开碎片',won:'航线完成',lost:'航线失败',all:'欢迎归航，快递员。',allBody:'五条航线全部完成！可以重玩任意航线，挑战更多包裹。',wonBody:(n,t)=>`已送达 ${n} 个包裹（目标 ${t}），并安全完成航线。`,lostBody:(n,t,h)=>h<=0?'船体遭到三次撞击。珊瑚色叉号是碎片，请在相遇前切到另一条轨道。':`送达 ${n}/${t} 个必需包裹。与薄荷色菱形处于同一轨道即可收集。`,nextRoute:'下一条航线',replay:'重玩航线',menu:'重玩最终航线',coming:(k,l,s)=>`${k==='parcel'?'◆ 包裹':'✕ 碎片'} · ${l===0?'内轨':'外轨'} · ${s.toFixed(1)}秒`,training:'训练航线没有碎片，可以放心练习。',disabledSave:'浏览器暂时无法保存进度，但仍可继续游玩。'}};
const t=()=>words[lang];let message='practice',saveFailed=false,levelsKey='';
function tell(key){message=key;$('notice').textContent=t()[key]||key}
function setup(i){index=i;state=R.create(i);mode='ready';practice=false;message='practice';if($('result').open)$('result').close();renderUI();draw()}
function switchLane(){if(mode==='ready'){state.lane=1-state.lane;practice=true;tell('practiceDone');renderUI()}else if(mode==='playing'){R.switchLane(state);renderUI()}}
function start(){if(mode!=='ready'||!practice)return;mode='playing';tell('travel');last=performance.now();renderUI()}
function pause(){if(mode==='playing'){mode='paused';tell('paused')}else if(mode==='paused'){mode='playing';last=performance.now();tell('travel')}renderUI()}
function finish(){mode='finished';resultWon=state.status==='won';if(resultWon){unlocked=Math.max(unlocked,Math.min(4,index+1));try{localStorage.setItem(KEY,String(unlocked))}catch{saveFailed=true}}renderUI();if(!$('result').open)$('result').showModal()}
function renderUI(){const w=t(),cfg=R.STAGES[index];canvas.setAttribute('aria-label',lang==='zh'?'两条轨道、快递船、即将相遇的包裹与碎片':'Two orbital lanes with a courier, incoming parcels and debris');$('levels').setAttribute('aria-label',lang==='zh'?'选择航线':'Choose a route');$('language').setAttribute('aria-label',lang==='zh'?'切换为英文':'Switch to Chinese');document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title='ORBIT COURIER';$('language').textContent=lang==='en'?'中文':'EN';$('routeLabel').textContent=w.route;$('routeValue').textContent=`0${index+1} / 05`;$('parcelLabel').textContent=w.parcel;$('parcelValue').textContent=`${state.delivered} / ${cfg.target}`;$('hullLabel').textContent=w.hull;$('hullValue').textContent='●'.repeat(state.hp)+'○'.repeat(3-state.hp);$('timeLabel').textContent=w.time;$('timeValue').textContent=Math.ceil(state.end-state.time)+'s';$('progress').style.width=(state.time/state.end*100)+'%';$('eyebrow').textContent=w.eyebrow;$('stageName').textContent=cfg.name[lang==='zh'?1:0];$('objective').textContent=w.goal(cfg.target);$('nextLabel').textContent=w.next;$('inner').textContent=w.inner;$('outer').textContent=w.outer;$('inner').className=state.lane===0?'active':'';$('outer').className=state.lane===1?'active':'';$('switch').textContent=w.switch;$('switch').disabled=mode==='paused'||mode==='finished';$('start').textContent=w.start;$('start').disabled=mode!=='ready'||!practice;$('pause').textContent=mode==='paused'?w.resume:w.pause;$('pause').disabled=mode==='ready'||mode==='finished';$('retry').textContent=w.retry;$('keys').textContent=w.keys;$('saveNote').textContent=saveFailed?w.disabledSave:w.saved;$('legendParcel').textContent=w.legendParcel;$('legendDebris').textContent=w.legendDebris;$('footer').textContent=w.footer;$('back').textContent=w.back;$('back').href=lang==='zh'?'/projects/game-demos':'/en/projects/game-demos';if($('notice').textContent!==(w[message]||message))$('notice').textContent=w[message]||message;let ev=state.events[state.cursor];$('incoming').textContent=mode==='ready'?w.ready:ev?w.coming(ev.kind,ev.lane,Math.max(0,ev.at-state.time)):(index===0&&mode==='playing'?w.training:w.travel);if(levelsKey!==`${index}:${unlocked}:${lang}`){levelsKey=`${index}:${unlocked}:${lang}`;$('levels').replaceChildren(...R.STAGES.map((_,i)=>{let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.disabled=i>unlocked;b.className=i===index?'selected':'';b.setAttribute('aria-label',w.route+' '+(i+1));b.onclick=()=>setup(i);return b}));}if(mode==='finished'){$('resultKicker').textContent='ORBIT COURIER';$('resultTitle').textContent=resultWon?(index===4?w.all:w.won):w.lost;$('resultBody').textContent=resultWon?(index===4?w.allBody:w.wonBody(state.delivered,cfg.target)):w.lostBody(state.delivered,cfg.target,state.hp);$('resultAction').textContent=resultWon&&index<4?w.nextRoute:w.replay;$('resultRetry').textContent=w.replay;$('resultRetry').classList.toggle('hidden',!resultWon||index===4)}}
function draw(){const W=640,C=320,anglespeed=R.STAGES[index].speed,angle=-Math.PI/2+state.time*anglespeed;ctx.clearRect(0,0,W,W);let grad=ctx.createRadialGradient(C,C,20,C,C,300);grad.addColorStop(0,'#29465b');grad.addColorStop(1,'#101e30');ctx.fillStyle=grad;ctx.fillRect(0,0,W,W);for(let i=0;i<54;i++){let x=(i*127+37)%640,y=(i*83+19)%640;ctx.fillStyle=i%3?'#536779':'#c0c3b6';ctx.fillRect(x,y,1.4,1.4)}for(let lane=0;lane<2;lane++){let radius=lane===0?174:250;ctx.beginPath();ctx.arc(C,C,radius,0,Math.PI*2);ctx.strokeStyle=state.lane===lane?'#8de4cc70':'#ffffff25';ctx.lineWidth=state.lane===lane?3:2;ctx.stroke();ctx.setLineDash([2,13]);ctx.beginPath();ctx.arc(C,C,radius+10,0,Math.PI*2);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='#ff836b';ctx.beginPath();ctx.arc(C,C,76,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0d855';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(C,C,96,24,-.45,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#101e30';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('POST / 09',C,C+5);for(const e of state.events.slice(state.cursor)){let eta=e.at-state.time;if(eta>4.4)break;let a=-Math.PI/2+e.at*anglespeed,r=e.lane===0?174:250,x=C+Math.cos(a)*r,y=C+Math.sin(a)*r;ctx.globalAlpha=eta>3?Math.max(.2,1-(eta-3)/2):1;ctx.save();ctx.translate(x,y);ctx.strokeStyle=e.kind==='parcel'?'#8de4cc':'#ff836b';ctx.fillStyle=e.kind==='parcel'?'#8de4cc':'#422c38';ctx.lineWidth=4;if(e.kind==='parcel'){ctx.rotate(Math.PI/4);ctx.fillRect(-10,-10,20,20);ctx.strokeStyle='#101e30';ctx.lineWidth=2;ctx.strokeRect(-5,-5,10,10)}else{ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(8,8);ctx.moveTo(-8,8);ctx.lineTo(8,-8);ctx.stroke()}ctx.restore();ctx.globalAlpha=1}let radius=state.lane===0?174:250,x=C+Math.cos(angle)*radius,y=C+Math.sin(angle)*radius;ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/2);ctx.fillStyle='#fff0d8';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(13,15);ctx.lineTo(0,9);ctx.lineTo(-13,15);ctx.closePath();ctx.fill();ctx.fillStyle='#ff836b';ctx.fillRect(-4,11,8,10);ctx.restore();ctx.strokeStyle='#fff0d830';ctx.beginPath();ctx.arc(x,y,29,0,Math.PI*2);ctx.stroke()}
function loop(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(mode==='playing'){let events=R.step(state,dt);if(events.length)tell(events[events.length-1]);if(state.status!=='playing')finish();else renderUI()}draw();requestAnimationFrame(loop)}
$('switch').onclick=switchLane;canvas.onclick=switchLane;$('start').onclick=start;$('pause').onclick=pause;$('retry').onclick=()=>setup(index);$('resultAction').onclick=()=>setup(resultWon&&index<4?index+1:index);$('resultRetry').onclick=()=>setup(index);$('language').onclick=()=>{lang=lang==='en'?'zh':'en';try{let u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch{}renderUI()};$('result').addEventListener('cancel',e=>{e.preventDefault();setup(index)});window.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;if($('result').open)return;if(e.code==='Space'){e.preventDefault();switchLane()}else if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();pause()}else if(e.key==='r'||e.key==='R'){setup(index)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});window.addEventListener('blur',()=>{if(mode==='playing')pause()});setup(index);last=performance.now();requestAnimationFrame(loop);
})();</script></body></html>
